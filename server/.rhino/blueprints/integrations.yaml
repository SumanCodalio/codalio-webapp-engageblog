model: Integration
slug: integrations
table: integrations

options:
  belongs_to_organization: true
  soft_deletes: false
  audit_trail: true
  pagination: true
  per_page: 25

columns:
  organization_id:
    type: foreignId
    foreign_model: Organization
    nullable: false
    index: true
  name:
    type: string
    nullable: false
    filterable: true
    sortable: true
    searchable: true
  category:
    type: string
    nullable: true
    filterable: true
    sortable: true
  description:
    type: text
    nullable: true
    searchable: true
  connected:
    type: boolean
    nullable: false
    default: false
    filterable: true
  client_id:
    type: string
    nullable: true
  api_key:
    type: string
    nullable: true
  auto_sync:
    type: boolean
    nullable: false
    default: true

relationships:
  - type: belongsTo
    model: Organization

permissions:
  admin:
    actions: [index, show, store, update, destroy]
    show_fields: "*"
    create_fields: "*"
    update_fields: "*"
  content_manager:
    actions: [index, show]
    show_fields: [id, name, category, description, connected]
    create_fields: []
    update_fields: []
  editor:
    actions: [index, show]
    show_fields: [id, name, category, description, connected]
    create_fields: []
    update_fields: []
  contributor:
    actions: []
    show_fields: []
    create_fields: []
    update_fields: []
