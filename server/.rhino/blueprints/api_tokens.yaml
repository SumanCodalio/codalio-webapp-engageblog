model: ApiToken
slug: api_tokens
table: api_tokens

options:
  belongs_to_organization: true
  soft_deletes: false
  audit_trail: true
  pagination: true
  per_page: 25

columns:
  organization_id:
    type: foreignId
    foreign_model: Organization
    nullable: false
    index: true
  name:
    type: string
    nullable: false
    filterable: true
    sortable: true
    searchable: true
  token_prefix:
    type: string
    nullable: false
    filterable: true
  last_used_at:
    type: datetime
    nullable: true
    sortable: true

relationships:
  - type: belongsTo
    model: Organization

permissions:
  admin:
    actions: [index, show, store, update, destroy]
    show_fields: "*"
    create_fields: "*"
    update_fields: "*"
  content_manager:
    actions: []
    show_fields: []
    create_fields: []
    update_fields: []
  editor:
    actions: []
    show_fields: []
    create_fields: []
    update_fields: []
  contributor:
    actions: []
    show_fields: []
    create_fields: []
    update_fields: []
